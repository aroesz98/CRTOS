<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:463px;height:698px;background:#FFFFFF;" width="463px" height="698px" viewBox="0 0 463 698" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="172.769" y="23.132" fill="#000" font-size="14" textLength="110.462" font-weight="700" font-family="Arial">Warstwy CRTOS</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" id="ent0001" data-source-line="4"><rect x="57" y="49.099" width="338.779" height="47.598" fill="#E8F1FB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="67" y="70.354" fill="#000" font-size="12" textLength="68.039" font-weight="700" font-family="Arial">L3 aplikacje</text><text x="138.373" y="70.354" fill="#000" font-size="12" textLength="191.438" font-family="Arial">(nieuprzywilejowane, osobne areny)</text><text x="67" y="84.153" fill="#000" font-size="12" textLength="318.779" font-family="Arial">wm, term, files, sysmon, settings, paint, NetSurf, sh, ping, ...</text></g><!--entity IPC--><g class="entity" data-qualified-name="IPC" id="ent0002" data-source-line="5"><rect x="103" y="133.099" width="247.438" height="33.799" fill="#F4F4F4" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="113" y="154.354" fill="#000" font-size="12" textLength="227.438" font-family="Arial">porty IPC, pamięć współdzielona, pliki /dev</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" id="ent0003" data-source-line="6"><rect x="43" y="203.099" width="366.852" height="47.598" fill="#E8F1FB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="53" y="224.354" fill="#000" font-size="12" textLength="52.67" font-weight="700" font-family="Arial">L2 usługi</text><text x="109.004" y="224.354" fill="#000" font-size="12" textLength="191.438" font-family="Arial">(nieuprzywilejowane, osobne areny)</text><text x="53" y="238.153" fill="#000" font-size="12" textLength="346.852" font-family="Arial">init, devmgr, gfxd, inputd, osk, netmgr, httpd, deployd, vncd, getty</text></g><!--entity ABI--><g class="entity" data-qualified-name="ABI" id="ent0004" data-source-line="7"><rect x="61" y="287.099" width="331.449" height="33.799" fill="#F4F4F4" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="71" y="308.354" fill="#000" font-size="12" textLength="311.449" font-family="Arial">ABI wywołań systemowych (svc #0), uchwyty, uprawnienia</text></g><!--entity L1--><g class="entity" data-qualified-name="L1" id="ent0005" data-source-line="8"><rect x="29.5" y="357.099" width="394.191" height="61.396" fill="#FDF1E4" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="39.5" y="378.354" fill="#000" font-size="12" textLength="97.359" font-weight="700" font-family="Arial">L1 sterowniki .ko</text><text x="140.193" y="378.354" fill="#000" font-size="12" textLength="267.469" font-family="Arial">(uprzywilejowane, ładowane wg drzewa urządzeń)</text><text x="39.5" y="392.153" fill="#000" font-size="12" textLength="374.191" font-family="Arial">pinctrl, clk, gpio, lpi2c, lpspi, lpuart, lcdif, pxp, gt911, ft5406, gpio-keys,</text><text x="39.5" y="405.952" fill="#000" font-size="12" textLength="275.08" font-family="Arial">enet + net-lwip, usb-imxrt, flexspi-mtd, trng, rtc-snvs</text></g><!--entity FW--><g class="entity" data-qualified-name="FW" id="ent0006" data-source-line="9"><rect x="6" y="454.099" width="440.85" height="33.799" fill="#F4F4F4" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16" y="475.354" fill="#000" font-size="12" textLength="420.85" font-family="Arial">frameworki podsystemów: clk, pinctrl, gpio, irq, i2c, spi, fb, gpu2d, input, net, tty</text></g><!--entity L0OS--><g class="entity" data-qualified-name="L0OS" id="ent0007" data-source-li