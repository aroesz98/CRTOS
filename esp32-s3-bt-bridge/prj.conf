# Bluetooth Classic (BR/EDR) host. DualSense / DualSense Edge are BR/EDR-only
# HID devices, so this needs a dual-mode radio (original ESP32, not S3/C3).
CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_DEVICE_NAME="ESP32 DualSense Host"
# Class of Device: Computer / Desktop workstation
CONFIG_BT_COD=0x000104

# Persist the link key in flash, so a paired controller can reconnect with
# the PS button after the ESP32 reboots.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_LOG=y
# Deferred logging keeps the UART out of the Bluetooth RX context, but by
# default the log thread only wakes up once a second or every 10 messages.
# Wake it up for every message, so controller events show up right away.
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
# Room for bursts of stick/trigger updates
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# HCI commands are issued from the system workqueue and input reports are
# parsed and printed from the Bluetooth RX context.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
