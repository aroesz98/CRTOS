# CRTOS init configuration (/sd/crtos/etc/init.cfg)
#
#   service <name> <respawn|once|wait> [caps=spawn,kill,module,sys,dev|all] <program> [args...]
#   console [caps=...] <program> [args...]
#
# The console program gets the serial terminal; Ctrl-] switches to the kernel monitor and
# its "exit" command switches back.

# layer 2: services
service devmgr respawn caps=module,dev /sd/crtos/sbin/devmgr.app
service gfxd respawn caps=dev /sd/crtos/sbin/gfxd.app
service inputd respawn caps=dev /sd/crtos/sbin/inputd.app
service osk respawn caps=dev /sd/crtos/sbin/osk.app
service netmgr respawn caps=sys /sd/crtos/sbin/netmgr.app
service httpd respawn /sd/crtos/sbin/httpd.app
service deployd respawn caps=sys,dev /sd/crtos/sbin/deployd.app
# remote desktop (VNC, port 5900; the password in /sd/crtos/etc/vnc.passwd, "crtos desktop")
service vncd respawn caps=sys /sd/crtos/sbin/vncd.app
# the shell on the USB serial port (J9 as a device, /dev/ttyACM0) when a terminal opens it
service getty respawn caps=all /sd/crtos/sbin/getty.app

# layer 3: the window manager (can be ended and started again while programs run)
service wm respawn caps=spawn,kill,sys /sd/crtos/apps/wm.app

# layer 3: start-up applications
# service demo once /sd/crtos/apps/gfxdemo.app
# service paint once /sd/crtos/apps/paint.app

console caps=all /sd/crtos/bin/sh.app
