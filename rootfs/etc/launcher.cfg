# Programs menu of the window manager (/sd/crtos/etc/launcher.cfg)
#
#   Title: [caps=spawn,kill,sys,dev,module] [icon=NAME] /path/program.app [args...]
#
# The capabilities are those the program gets (at most the window manager's own). The icon is
# /sd/crtos/share/icons/NAME.pam, by default the program's own (its file name without ".app").
# An entry whose program is missing is left out, and so is one whose title an earlier entry
# has: the games are on /flash0 ("crtos deploy"), else on the card.

Terminal: caps=spawn,kill /sd/crtos/apps/term.app
Files: caps=spawn /sd/crtos/apps/files.app
NetSurf: /sd/crtos/apps/netsurf.app
System monitor: caps=kill /sd/crtos/apps/sysmon.app
Settings: caps=sys,kill /sd/crtos/apps/settings.app
Voxel: /flash0/apps/voxel.app
Voxel: /sd/crtos/apps/voxel.app
NES: /flash0/apps/nes.app
NES: /sd/crtos/apps/nes.app
SNES: /flash0/apps/snes.app
SNES: /sd/crtos/apps/snes.app
Paint: /sd/crtos/apps/paint.app
Animation demo: /sd/crtos/apps/gfxdemo.app
TFTLIB clock: /sd/crtos/apps/tftdemo.app
Hello world: /sd/crtos/apps/hello_world.app
