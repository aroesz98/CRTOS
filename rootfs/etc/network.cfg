# CRTOS network configuration (/sd/crtos/etc/network.cfg), read by netmgr at start
#
#   iface <name> dhcp
#   iface <name> static <addr>/<bits> [gw <addr>]
#   dns <server> [<server>]     fixed DNS servers (else the ones from DHCP)
#   ntp <server> | off          set the clock at start and every hour

iface eth0 dhcp
ntp pool.ntp.org
